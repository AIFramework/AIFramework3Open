name: Docs lint

# Две независимые проверки документации теории:
#
#   1. Канон структуры (Docs/Tutorials/STRUCTURE.md). Ошибки роняют сборку
#      всегда; предупреждения — только новые, не занесённые в
#      Docs/Tutorials/.docslint-baseline.
#
#   2. Компиляция примеров кода против настоящих src/AI.*. Ловит то, что
#      структурному линтеру недоступно: несуществующие классы и пространства
#      имён. Список непроверяемых документов — Tools/SnippetCheck/skip.txt.
#
# Обе применяются к новым документам, не требуя разом переписать существующие.

on:
  push:
    branches: [main]
    paths:
      - 'Docs/Tutorials/**'
      - 'Demo/WebUI/AiFrameworkDemo/AiFrameworkDemo/Modules/**'
      - 'Tools/DocsLint/**'
      - 'Tools/SnippetCheck/**'
      # Примеры компилируются против src: изменение API ломает документацию
      - 'src/**'
      - '.github/workflows/docs-lint.yml'
  pull_request:
    paths:
      - 'Docs/Tutorials/**'
      - 'Demo/WebUI/AiFrameworkDemo/AiFrameworkDemo/Modules/**'
      - 'Tools/DocsLint/**'
      - 'Tools/SnippetCheck/**'
      - 'src/**'
      - '.github/workflows/docs-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Линтер не зависит от решения: собираем только его, без src/ и демо
      - name: Run docs linter
        run: dotnet run --project Tools/DocsLint --nologo -- --strict

      # Раскладываем примеры из .md в .cs. Документы из
      # Tools/SnippetCheck/skip.txt пропускаются, всё остальное обязано собраться.
      - name: Generate code snippets
        run: dotnet run --project Tools/DocsLint --nologo -- --emit-snippets Tools/SnippetCheck

      # Компилятор ловит то, что линтеру структуры недоступно: несуществующие
      # классы и пространства имён, разошедшиеся сигнатуры, устаревшие API.
      - name: Compile documentation snippets
        run: dotnet build Tools/SnippetCheck --nologo -v minimal

      # Подсказка вместо молчаливого падения: чаще всего чинится одной командой
      - name: Hint on failure
        if: failure()
        run: |
          echo "::notice::Синонимы разделов чинятся автоматически:"
          echo "::notice::  dotnet run --project Tools/DocsLint -- --fix"
          echo "::notice::Канон: Docs/Tutorials/STRUCTURE.md"
          echo "::notice::Ошибка вида «S_Foo_bar.g.cs(N): error CS...» означает,"
          echo "::notice::что не собирается пример в Docs/Tutorials/Foo/bar.md."
          echo "::notice::Подробности: Tools/SnippetCheck/README.md"
